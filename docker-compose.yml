services:
  careerlens:
    build: .
    container_name: careerlens-ai
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      DATABASE_URL: "file:/app/data/careerlens.db"
      # 🔑 CHANGE THIS — openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      SESSION_TTL_SECONDS: "604800"
      RESUME_UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: "5242880"
      # Optional AI keys (app falls back to deterministic engine without them):
      # AI_API_KEY: ${AI_API_KEY:-}
      # AI_BASE_URL: https://api.openai.com/v1
      # AI_MODEL: gpt-4o-mini
    volumes:
      - careerlens-data:/app/data
      - careerlens-uploads:/app/uploads
    restart: unless-stopped

volumes:
  careerlens-data:
  careerlens-uploads:
